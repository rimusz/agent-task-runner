# Auto-tag the next v* release on push to main. Never force-push or delete main or tags.
# First release is v0.1.1. Later pushes bump patch, or minor/major via
# PR label release:minor|release:major or those markers in the commit message.
# Version is injected at build time (ATR_RELEASE_VERSION); CI does not commit to main.
name: release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: read

jobs:
  meta:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.decide.outputs.skip }}
      ver: ${{ steps.decide.outputs.ver }}
      tag: ${{ steps.decide.outputs.tag }}
      bump: ${{ steps.decide.outputs.bump }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch tags
        run: git fetch origin --tags
      - name: Decide next version
        id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          labels=""
          if [ -n "${GITHUB_REPOSITORY:-}" ]; then
            labels=$(gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" \
              --jq '.[].labels[].name' 2>/dev/null || true)
          fi
          export LABELS="$labels"
          sh contrib/release-decide.sh | tee /tmp/decide.txt
          cat /tmp/decide.txt >> "$GITHUB_OUTPUT"
          skip=$(awk -F= '/^skip=/{v=$2} END{print v}' /tmp/decide.txt)
          tag=$(awk -F= '/^tag=/{v=$2} END{print v}' /tmp/decide.txt)
          if [ "$skip" = "no" ] && [ -n "$tag" ]; then
            if git ls-remote --exit-code --tags origin "refs/tags/${tag}"; then
              echo "tag ${tag} already exists; skip (never overwrite)"
              echo "skip=yes" >> "$GITHUB_OUTPUT"
              echo "reason=exists" >> "$GITHUB_OUTPUT"
            fi
          fi

  build:
    needs: meta
    if: needs.meta.outputs.skip == 'no'
    # Rust target triples are for building only; assets use friendly names.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: macos-arm64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: linux-x86_64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            asset: linux-arm64
            packages: gcc-aarch64-linux-gnu
            linker: aarch64-linux-gnu-gcc
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset: linux-x86_64-musl
            packages: musl-tools
            linker: musl-gcc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Cross / musl packages
        if: matrix.packages != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.packages }}
      - name: Build and pack
        env:
          TARGET: ${{ matrix.target }}
          ASSET: ${{ matrix.asset }}
          VER: ${{ needs.meta.outputs.ver }}
          LINKER: ${{ matrix.linker }}
          ATR_RELEASE_VERSION: ${{ needs.meta.outputs.ver }}
        run: |
          set -euo pipefail
          if [ -n "${LINKER:-}" ]; then
            export "CARGO_TARGET_$(echo "$TARGET" | tr 'a-z-' 'A-Z_')_LINKER=$LINKER"
            export "CC_$(echo "$TARGET" | tr '-' '_')=$LINKER"
          fi
          cargo build --release --target "$TARGET"
          cp "target/${TARGET}/release/atr" atr
          tar -czf "atr-${VER}-${ASSET}.tar.gz" atr config contrib \
            LICENSE-MIT LICENSE-APACHE THIRD_PARTY_LICENSES
          if command -v sha256sum >/dev/null; then
            sha256sum "atr-${VER}-${ASSET}.tar.gz" > "atr-${VER}-${ASSET}.tar.gz.sha256"
          else
            shasum -a 256 "atr-${VER}-${ASSET}.tar.gz" > "atr-${VER}-${ASSET}.tar.gz.sha256"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: atr-${{ matrix.asset }}
          path: |
            atr-*.tar.gz
            atr-*.tar.gz.sha256

  publish:
    needs: [meta, build]
    if: needs.meta.outputs.skip == 'no'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create tag and GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VER: ${{ needs.meta.outputs.ver }}
          TAG: ${{ needs.meta.outputs.tag }}
          BUMP: ${{ needs.meta.outputs.bump }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}"; then
            echo "tag ${TAG} already exists; not overwriting"
            exit 1
          fi
          ls -l dist
          gh release create "$TAG" \
            --title "$TAG" \
            --notes "atr ${VER} (${BUMP:-patch}): macOS Apple Silicon and Linux (x86_64/aarch64 glibc, x86_64 musl static)." \
            dist/atr-*.tar.gz \
            dist/atr-*.tar.gz.sha256
