# On-demand releases only. A push or merge to main never releases (ci.yml
# builds and tests it). A release runs only when you:
#   (a) start this workflow by hand (Actions > release > Run workflow), with an
#       optional version (else the patch is bumped from the latest v* tag, or
#       use the bump input for minor/major), or
#   (b) push a tag vX.Y.Z (git tag v0.2.0 && git push origin v0.2.0).
# See docs/RELEASING.md. Never force-push or delete main or tags.
# Version is stamped at build time (ATR_RELEASE_VERSION, and Cargo.toml in the
# build checkout only); CI does not commit to main.
name: release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, e.g. 0.2.0 (empty = bump from latest tag)
        type: string
        default: ''
      bump:
        description: Bump used when version is empty
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write

jobs:
  meta:
    # Manual runs release from main only; tag pushes release the tag.
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.decide.outputs.skip }}
      ver: ${{ steps.decide.outputs.ver }}
      tag: ${{ steps.decide.outputs.tag }}
      bump: ${{ steps.decide.outputs.bump }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch tags
        run: git fetch origin --tags --force
      - name: Decide version
        id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          VERSION: ${{ inputs.version }}
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          sh contrib/release-decide.sh | tee /tmp/decide.txt
          cat /tmp/decide.txt >> "$GITHUB_OUTPUT"
          skip=$(awk -F= '/^skip=/{v=$2} END{print v}' /tmp/decide.txt)
          reason=$(awk -F= '/^reason=/{v=$2} END{print v}' /tmp/decide.txt)
          tag=$(awk -F= '/^tag=/{v=$2} END{print v}' /tmp/decide.txt)
          if [ "$skip" = yes ]; then
            echo "::warning::no release: ${tag} ${reason} (pick another version)"
          fi
          if [ "$reason" = tag ] && gh release view "$tag" >/dev/null 2>&1; then
            echo "release ${tag} already exists; skip (never overwrite)"
            echo "skip=yes" >> "$GITHUB_OUTPUT"
            echo "reason=exists" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: meta
    if: needs.meta.outputs.skip == 'no'
    # Rust target triples are for building only; assets use friendly names.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: macos-arm64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: linux-x86_64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            asset: linux-arm64
            packages: gcc-aarch64-linux-gnu
            linker: aarch64-linux-gnu-gcc
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset: linux-x86_64-musl
            packages: musl-tools
            linker: musl-gcc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Cross / musl packages
        if: matrix.packages != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.packages }}
      - name: Build and pack
        env:
          TARGET: ${{ matrix.target }}
          ASSET: ${{ matrix.asset }}
          VER: ${{ needs.meta.outputs.ver }}
          LINKER: ${{ matrix.linker }}
          ATR_RELEASE_VERSION: ${{ needs.meta.outputs.ver }}
        run: |
          set -euo pipefail
          # Keep Cargo.toml (CARGO_PKG_VERSION) in step with the tag, in this
          # checkout only; atr --version uses ATR_RELEASE_VERSION.
          perl -0pi -e 's/^version = "[^"]*"/version = "$ENV{VER}"/m' Cargo.toml
          if [ -n "${LINKER:-}" ]; then
            export "CARGO_TARGET_$(echo "$TARGET" | tr 'a-z-' 'A-Z_')_LINKER=$LINKER"
            export "CC_$(echo "$TARGET" | tr '-' '_')=$LINKER"
          fi
          cargo build --release --target "$TARGET"
          if [ "$TARGET" != aarch64-unknown-linux-gnu ]; then
            got=$("target/${TARGET}/release/atr" --version)
            echo "$got"
            case $got in *" ${VER} "*) ;; *) echo "version mismatch: want ${VER}"; exit 1 ;; esac
          fi
          cp "target/${TARGET}/release/atr" atr
          tar -czf "atr-${VER}-${ASSET}.tar.gz" atr config contrib \
            LICENSE-MIT LICENSE-APACHE THIRD_PARTY_LICENSES
          if command -v sha256sum >/dev/null; then
            sha256sum "atr-${VER}-${ASSET}.tar.gz" > "atr-${VER}-${ASSET}.tar.gz.sha256"
          else
            shasum -a 256 "atr-${VER}-${ASSET}.tar.gz" > "atr-${VER}-${ASSET}.tar.gz.sha256"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: atr-${{ matrix.asset }}
          path: |
            atr-*.tar.gz
            atr-*.tar.gz.sha256

  publish:
    needs: [meta, build]
    if: needs.meta.outputs.skip == 'no'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create tag and GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VER: ${{ needs.meta.outputs.ver }}
          TAG: ${{ needs.meta.outputs.tag }}
          BUMP: ${{ needs.meta.outputs.bump }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release ${TAG} already exists; not overwriting"
            exit 1
          fi
          ls -l dist
          # Tag push: the tag exists. Manual run: gh creates it at this commit.
          gh release create "$TAG" --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes "atr ${VER} (${BUMP:-manual}): macOS Apple Silicon and Linux (x86_64/aarch64 glibc, x86_64 musl static)." \
            dist/atr-*.tar.gz \
            dist/atr-*.tar.gz.sha256
