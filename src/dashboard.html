<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>atr</title>
<style>
:root {
  color-scheme: dark;
  --bg: #0d1117;
  --card: #161b22;
  --border: #30363d;
  --text: #e6edf3;
  --muted: #8b949e;
  --blue: #4c8bf5;
  --orange: #e3b341;
  --ok: #3fb950;
  --warn: #d29922;
  --fail: #f85149;
  --radius: 8px;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { overflow-x: hidden; }
body {
  font: 14px/1.45 system-ui, sans-serif;
  margin: 0;
  background: var(--bg);
  color: var(--text);
}
.page { max-width: 1200px; margin: 0 auto; padding: 16px 20px 40px; }
h1 {
  font-size: 1.25rem; font-weight: 700; margin: 0 10px 0 0;
  letter-spacing: -0.02em; display: inline; vertical-align: middle;
}
h2 { font-size: 0.95rem; font-weight: 600; margin: 0 0 10px; }
.hdr { display: block; margin: 0 0 12px; line-height: 1.45; }
.online {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: .9rem; margin-right: 6px; vertical-align: middle;
}
.dot {
  width: 8px; height: 8px; border-radius: 50%;
  display: inline-block; background: var(--ok); flex-shrink: 0;
}
.dot.warn { background: var(--warn); }
.dot.fail { background: var(--fail); }
.meta { color: var(--muted); font-size: .85rem; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px 18px;
  margin: 0 0 12px;
  min-width: 0;
}
.kpis {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 12px;
  margin: 0 0 12px;
}
.kpi {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 16px;
}
.kpi-label {
  font-size: 11px;
  letter-spacing: .06em;
  text-transform: uppercase;
  color: var(--muted);
  font-weight: 600;
}
.kpi-val {
  font: 700 1.7rem/1.2 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-variant-numeric: tabular-nums;
  margin: 6px 0 4px;
}
.kpi-sub { font-size: 12px; color: var(--muted); }
.swatch {
  display: inline-block; width: 7px; height: 7px; border-radius: 2px;
  margin: 0 4px 0 0; vertical-align: middle;
}
.swatch.in { background: var(--blue); }
.swatch.out { background: var(--orange); }
.in { color: var(--blue); }
.out { color: var(--orange); }
.filters {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 14px;
  align-items: center;
  margin: 0 0 14px;
  padding: 10px 14px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
}
.filters label {
  font-size: 12px;
  color: var(--muted);
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
select, input[type=date] {
  background: var(--bg);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 4px 8px;
  font: inherit;
}
table { width: 100%; border-collapse: collapse; font-size: .85rem; }
th, td {
  text-align: left; padding: .35rem .45rem; border-bottom: 1px solid var(--border);
  vertical-align: top; white-space: nowrap; word-break: normal; overflow-wrap: normal; hyphens: none;
}
/* Only long free text wraps, at word boundaries; everything else stays on one line. */
td.wrap, td.wide { white-space: normal; overflow-wrap: break-word; }
td.wide { min-width: 16rem; }
td.wrap { min-width: 10rem; }
.seg { white-space: nowrap; }
td.num, th.num { min-width: 4.5rem; }
.scroll { overflow-x: auto; max-width: 100%; }
.badge[title] { cursor: help; }
th { color: var(--muted); font-weight: 600; }
.ok { color: var(--ok); }
.warn { color: var(--warn); }
.fail { color: var(--fail); }
pre {
  white-space: pre-wrap;
  font: 12px/1.35 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  background: var(--bg);
  padding: .75rem;
  overflow: auto;
  max-height: 18rem;
  border-radius: 6px;
  margin: 0;
}
.empty { color: var(--muted); }
.banner { padding: .65rem .9rem; border-radius: var(--radius); margin: 0 0 12px; font-weight: 600; }
.banner.fail { background: #f8514922; border: 1px solid var(--fail); color: #ffa198; }
.banner.warn { background: #d2992222; border: 1px solid var(--warn); color: var(--orange); }
.badges { display: flex; flex-wrap: wrap; gap: .35rem; margin: 0 0 12px; }
.badge { font-size: .75rem; padding: .15rem .55rem; border-radius: 999px; border: 1px solid var(--border); color: var(--muted); }
.badge.ok { border-color: var(--ok); color: var(--ok); }
.badge.warn { border-color: var(--warn); color: var(--warn); }
.badge.fail { border-color: var(--fail); color: var(--fail); }
th.sortable { cursor: pointer; user-select: none; }
th.sortable:hover { text-decoration: underline; }
tr.total td { font-weight: 700; border-top: 2px solid var(--border); }
.bar {
  display: inline-block; height: .55rem; background: var(--blue);
  border-radius: 2px; vertical-align: middle; margin-right: .3rem;
}
.bar.out { background: var(--orange); }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
abbr { cursor: help; }
a { color: inherit; }
.chart-pair {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin: 0 0 12px;
}
.chart-block { min-width: 0; }
.chart-title { font-weight: 600; margin: 0 0 2px; }
.chart-sub { color: var(--muted); font-size: .8rem; margin: 0 0 8px; }
.card-head {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 8px 12px;
  margin: 0 0 10px;
}
.card-head h2 { margin: 0; }
@media (max-width: 900px) {
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .chart-pair { grid-template-columns: 1fr; }
}
@media (max-width: 520px) {
  .kpis { grid-template-columns: 1fr; }
  .page { padding: 12px 12px 32px; }
}
</style>
</head>
<body>
<div class="page">
<header class="hdr">
  <h1>atr</h1>
  <span class="online"><span class="dot" id="statusDot"></span><span id="statusText">Online</span></span>:
  <span class="meta" id="ver"></span>
  <span class="meta" id="meta">loading…</span>
</header>
<div class="badges" id="health"></div>
<div id="ghauth" class="banner" hidden></div>
<div id="tghealth" class="banner" hidden></div>
<div class="kpis" id="kpis"></div>
<div class="filters">
  <label>repo <select id="repoFilter"><option value="">all</option></select></label>
  <label>status <select id="statusFilter"><option value="">all</option><option>success</option><option>failed</option><option>cancelled</option><option>running</option><option>queued</option><option>held</option></select></label>
  <label>provider <select id="providerFilter"><option value="">all</option></select></label>
  <label>window <select id="windowFilter"><option value="">all</option><option value="1">1h</option><option value="24">24h</option><option value="168">7d</option></select></label>
</div>
<section class="card">
  <h2>Repos</h2>
  <div id="repos"></div>
</section>
<section class="card" id="tgCard" hidden>
  <h2>Telegram assistant</h2>
  <p class="meta" id="tgAssistant" hidden></p>
</section>
<section class="card">
  <h2>Running</h2>
  <div id="running"></div>
</section>
<section class="card">
  <h2>Queued</h2>
  <div id="queued"></div>
</section>
<section class="card">
  <h2>Finished</h2>
  <div id="finished"></div>
</section>
<section class="card">
  <h2>Providers</h2>
  <div id="providers"></div>
</section>
<section class="card">
  <h2>Today</h2>
  <div id="today"></div>
</section>
<section class="card">
  <div class="card-head">
    <h2>Token savings</h2>
    <label class="meta">period
      <select id="period">
        <option value="today">today</option>
        <option value="7d">7d</option>
        <option value="30d">30d</option>
        <option value="month">this month</option>
        <option value="custom">custom</option>
      </select>
    </label>
    <span id="customDates" hidden>
      <input type="date" id="from">
      <input type="date" id="to">
    </span>
    <span class="meta" id="savingsMeta"></span>
  </div>
  <div id="chart" class="empty"></div>
  <div id="savings"></div>
</section>
<section class="card">
  <h2>Logs</h2>
  <pre id="logs" class="empty">(none)</pre>
</section>
</div>

<script>
const $ = id => document.getElementById(id);
const sortState = {};
let last = null;
function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
}
function num(n) {
  if (n === null || n === undefined || n === "" || isNaN(Number(n))) return esc(n ?? "-");
  return Number(n).toLocaleString("en-US");
}
function usd(n) { return n == null ? "-" : "$" + Number(n).toFixed(4); }
function compact(n) {
  const x = Number(n);
  if (n === null || n === undefined || n === "" || isNaN(x)) return "-";
  const a = Math.abs(x);
  if (a >= 1e6) return (x / 1e6).toFixed(a >= 1e7 ? 0 : 1).replace(/\.0$/, "") + "M";
  if (a >= 1e3) return (x / 1e3).toFixed(1).replace(/\.0$/, "") + "K";
  if (Number.isInteger(x)) return String(x);
  return x.toFixed(2).replace(/\.00$/, "");
}
function kpi(label, value, sub) {
  return '<div class="kpi"><div class="kpi-label">' + esc(label) + '</div>' +
    '<div class="kpi-val">' + value + '</div>' +
    (sub ? '<div class="kpi-sub">' + sub + '</div>' : "") + "</div>";
}
// headers: string or {t: label, tip: tooltip, num: true}
function rows(id, headers, items, cells, totalRow, colCls) {
  if ((!items || !items.length) && !totalRow) return '<p class="empty">(none)</p>';
  const hs = headers.map(h => typeof h === "string" ? {t: h} : h);
  let h = '<div class="scroll"><table data-id="' + id + '"><thead><tr>' + hs.map((x, i) =>
    '<th class="sortable' + (x.num ? ' num' : '') + '" data-col="' + i + '"' + (x.tip ? ' title="' + esc(x.tip) + '"' : '') + '>' +
    (x.tip ? '<abbr>' + esc(x.t) + '</abbr>' : esc(x.t)) + "</th>").join("") + "</tr></thead><tbody>";
  const cellHtml = (cs) => cs.map((x, i) => {
    const c = [(hs[i] && hs[i].num) ? "num" : "", (colCls && colCls[i]) || ""].filter(Boolean).join(" ");
    return '<td' + (c ? ' class="' + c + '"' : '') + '>' + x + "</td>";
  }).join("");
  const body = (items || []).map(it => ({html: cellHtml(cells(it)), key: cells(it).map(c => String(c).replace(/<[^>]*>/g, ""))}));
  const st = sortState[id];
  if (st) {
    body.sort((a, b) => {
      const x = a.key[st.col] ?? "", y = b.key[st.col] ?? "";
      const nx = parseFloat(x.replace(/[$,%]/g, "")), ny = parseFloat(y.replace(/[$,%]/g, ""));
      const c = (!isNaN(nx) && !isNaN(ny)) ? nx - ny : x.localeCompare(y);
      return st.dir * c;
    });
  }
  for (const r of body) h += "<tr>" + r.html + "</tr>";
  if (totalRow) h += '<tr class="total">' + cellHtml(cells(totalRow)) + "</tr>";
  return h + "</tbody></table></div>";
}
document.addEventListener("click", e => {
  const th = e.target.closest("th.sortable");
  if (!th) return;
  const id = th.closest("table").dataset.id, col = Number(th.dataset.col);
  const cur = sortState[id];
  sortState[id] = {col, dir: cur && cur.col === col ? -cur.dir : 1};
  if (last) paint(last);
});
function cls(state) {
  const s = String(state || "").toLowerCase();
  if (s === "success" || s === "waiting" || s === "ok") return "ok";
  if (s === "failed" || s === "cancelled" || s === "verify_failed" || s === "fail") return "fail";
  if (s) return "warn";
  return "";
}
function elapsedSince(iso) {
  const t = Date.parse(iso || "");
  if (isNaN(t)) return "-";
  let s = Math.max(0, Math.floor((Date.now() - t) / 1000));
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60); s = s % 60;
  return (h ? h + "h " : "") + (h || m ? m + "m " : "") + s + "s";
}
function inWindow(iso) {
  const w = Number($("windowFilter").value);
  if (!w) return true;
  const t = Date.parse(iso || "");
  return !isNaN(t) && Date.now() - t <= w * 3600 * 1000;
}
function keep(t, state, iso) {
  const sf = $("statusFilter").value, pf = $("providerFilter").value;
  if (sf && sf !== state) return false;
  if (pf && pf !== t.provider) return false;
  return inWindow(iso);
}
function badge(level, text, tip) {
  return '<span class="badge ' + cls(level) + '"' + (tip ? ' title="' + esc(tip) + '"' : '') + '>' + esc(text) + '</span>';
}
function shortTime(full, now) {
  const f = String(full || "");
  if (!/^\d{4}-\d{2}-\d{2} \d{2}:\d{2}/.test(f)) return esc(f || "-");
  const same = String(now || "").slice(0, 10) === f.slice(0, 10);
  const txt = same ? f.slice(11, 16) : f.slice(5, 10) + " " + f.slice(11, 16);
  return '<span title="' + esc(f) + '">' + esc(txt) + '</span>';
}
// Provider usage: "5h 0% · resets Oct 16; 7d 4% · resets Oct 17". Each
// segment is nowrap so the cell wraps only between segments; the full
// timestamp (with zone) is in the hover title.
function usageCell(p) {
  const segs = p.usage_segments || [];
  if (!segs.length) {
    return (p.usage && p.usage !== "-") ? esc(p.usage) : '<span class="empty" title="this CLI does not report plan usage">-</span>';
  }
  return segs.map(s => '<span class="seg"' + (s.reset_full ? ' title="resets ' + esc(s.reset_full) + '"' : "") + ">" +
    esc(s.text) + (s.reset ? " · " + esc(s.reset) : "") + "</span>").join("; ");
}
// Telegram assistant task keys (tg<chat id>) read as "Telegram".
function taskKey(k) {
  const m = /^tg(-?\d+)$/.exec(String(k || ""));
  return m ? '<span title="Telegram chat ' + esc(m[1]) + '">Telegram</span>' : esc(k);
}
function provModel(p, m) {
  return esc(p || "-") + (m && m !== "-" ? ' <span class="meta">/ ' + esc(m) + '</span>' : "");
}
function setOptions(sel, names) {
  const cur = sel.value;
  sel.innerHTML = '<option value="">all</option>' + names.map(n =>
    '<option value="'+esc(n)+'"'+(n===cur?' selected':'')+'>'+esc(n)+'</option>').join('');
}
const SAV_TIPS = {
  headline: "cache hit % over runs with at least the minimum input tokens (the number to watch)",
  first: "first run of a task: cold cache expected",
  resume: "resumed runs (follow-ups, retries): should hit the cache well",
  short: "short runs below the minimum input; excluded from the headline",
};
function setStatus(level, label) {
  const dot = $("statusDot"), txt = $("statusText");
  if (dot) dot.className = "dot" + (level && level !== "ok" ? " " + level : "");
  if (txt) txt.textContent = label || (level === "fail" ? "Failing" : level === "warn" ? "Degraded" : "Online");
}
function paint(d) {
  last = d;
  const ga = d.github_auth || {};
  const gb = $("ghauth");
  if (ga.level === "fail" || ga.level === "warn") {
    gb.className = "banner " + ga.level;
    gb.textContent = (ga.level === "fail" ? "GitHub auth failing: " : "GitHub token: ") + (ga.message || "");
    gb.hidden = false;
  } else { gb.hidden = true; }
  const th = d.telegram_health || {};
  const tb = $("tghealth");
  if (th.level === "fail" || th.level === "warn") {
    tb.className = "banner " + th.level;
    tb.textContent = "Telegram: " + (th.message || "");
    tb.hidden = false;
  } else { tb.hidden = true; }
  if (d.version) $("ver").textContent = "v" + d.version;
  const now = d.now || "";
  const tzPrefix = d.timezone && !now.includes(d.timezone) ? d.timezone + " · " : "";
  $("meta").textContent = tzPrefix + now +
    " · " + (d.listen || "") + (d.intake_paused ? " · intake paused" : "") +
    (d.driver ? " · driver " + d.driver : "") +
    (d.host && d.host.line ? " · " + d.host.line : "") + " · refresh 5s";
  const st = d.stats_today || {};
  const todayRows = d.today || [];
  const sumToday = k => todayRows.reduce((a, r) => a + (Number(r[k]) || 0), 0);
  const tokIn = sumToday("input") + sumToday("cached") + sumToday("cache_write");
  const tokOut = sumToday("output");
  const costToday = todayRows.filter(r => r.cost_usd != null).reduce((a, r) => a + Number(r.cost_usd), 0);
  const hasCost = todayRows.some(r => r.cost_usd != null);
  const sav0 = d.savings || {};
  const saved = sav0.total && sav0.total.tokens_saved != null ? sav0.total.tokens_saved : (sav0.by_provider || []).reduce((a, r) => a + (Number(r.tokens_saved) || 0), 0);
  const nRun = (d.running || []).length, nQueue = (d.queued || []).length;
  const fin = Number(st.runs) || 0, okN = Number(st.success) || 0;
  const failN = Math.max(0, fin - okN);
  $("kpis").innerHTML =
    kpi("Running", compact(nRun), nRun ? "active now" : "none running") +
    kpi("Queued", compact(nQueue), nQueue ? "waiting" : "none waiting") +
    kpi("Finished today", compact(fin), st.success_rate == null ? "no finished runs" : num(okN) + " succeeded") +
    kpi("Success today", compact(okN), st.success_rate == null ? "no finished runs" : esc(String(st.success_rate)) + "% success") +
    kpi("Failed today", compact(failN), fin ? compact(failN) + " of " + compact(fin) : "none") +
    kpi("Tokens today", compact(tokIn + tokOut),
      '<span class="swatch in"></span><span class="in">' + compact(tokIn) + ' in</span> · <span class="swatch out"></span><span class="out">' + compact(tokOut) + " out</span>") +
    kpi("Cost today", hasCost ? "$" + Number(costToday).toFixed(4) : "-", hasCost ? num(fin) + " runs" : "no cost reported") +
    kpi("Tokens saved", compact(saved), esc(sav0.period || "today") + (sav0.from ? " " + sav0.from + (sav0.to ? ".." + sav0.to : "") : ""));
  const hl = d.health || {};
  let hb = "";
  const toks = (hl.github && hl.github.tokens) || [];
  // Healthy items stay compact (details on hover); amber/red ones expand.
  const bad = l => cls(l) === "warn" || cls(l) === "fail";
  const tokTip = t => (t.owner || t.token_env || "token") + (t.days_left != null ? " " + t.days_left + "d" : "") + (t.message ? ": " + t.message : "");
  const badToks = toks.filter(t => bad(t.level)), okToks = toks.filter(t => !bad(t.level));
  if (okToks.length) hb += badge("ok", "GitHub ok", okToks.map(tokTip).join("\n"));
  badToks.forEach(t => hb += badge(t.level, "GitHub " + tokTip(t), t.message));
  if (!toks.length && hl.github) hb += bad(hl.github.level) ? badge(hl.github.level, "GitHub: " + (hl.github.message || hl.github.level), hl.github.message) : badge(hl.github.level, "GitHub ok", hl.github.message);
  if (hl.telegram && hl.telegram.enabled) hb += bad(hl.telegram.level) ? badge(hl.telegram.level, "Telegram failing", "details in the banner above") : badge(hl.telegram.level, "Telegram ok", hl.telegram.message);
  // CLIs collapse to one badge; only missing ones get their own (red) badge.
  const clis = hl.clis || [];
  const okClis = clis.filter(c => c.present), badClis = clis.filter(c => !c.present);
  if (okClis.length) hb += badge("ok", okClis.length + " CLIs ok", okClis.map(c => c.name + " " + (c.version || "?")).join("\n"));
  badClis.forEach(c => hb += badge("fail", c.name + " missing", "CLI binary not found"));
  if (hl.uptime) hb += badge("ok", "up " + hl.uptime, "service uptime");
  $("health").innerHTML = hb;
  const levels = [];
  if (hl.github) levels.push(hl.github.level);
  toks.forEach(t => levels.push(t.level));
  if (hl.telegram && hl.telegram.enabled) levels.push(hl.telegram.level);
  badClis.forEach(() => levels.push("fail"));
  if (ga.level) levels.push(ga.level);
  if (th.level) levels.push(th.level);
  if (d.intake_paused) levels.push("warn");
  const overall = levels.some(l => cls(l) === "fail") ? "fail" : levels.some(l => cls(l) === "warn") ? "warn" : "ok";
  setStatus(overall);
  setOptions($("repoFilter"), (d.repos || []).filter(r => r.mode === "direct").map(r => r.name).filter(Boolean));
  setOptions($("providerFilter"), (d.providers || []).map(p => p.name));
  $("repos").innerHTML = rows("repos", ["name","mode","github","label",{t:"token env",tip:"env var used for GitHub (name only, never the value)"},"path"], d.repos, r => [
    esc(r.name) + (r.enabled ? "" : ' <span class="warn">(disabled)</span>'), esc(r.mode), esc(r.github || "-"), esc(r.label || "-"), esc(r.token_env || "-"), esc(r.path || "-")
  ], null, ["","","","","","wrap"]);
  const ta = d.telegram_assistant, tae = $("tgAssistant"), tac = $("tgCard");
  if (ta && ta.enabled) {
    tae.innerHTML = "provider " + esc(ta.provider_display || "-") +
      ' · workspace <span title="read-only scratch repo; not a watched repo">' + esc(ta.workspace || "-") + "</span> · " +
      num(ta.chats_today || 0) + " chats / " + num(ta.runs_today || 0) + " runs today · last activity " + shortTime(ta.last_activity, d.now);
    tae.hidden = false;
    if (tac) tac.hidden = false;
  } else {
    tae.hidden = true;
    if (tac) tac.hidden = true;
  }
  const run = (d.running || []).filter(t => keep(t, "running", t.started_utc));
  $("running").innerHTML = rows("running", ["key","repo","role","provider / model","elapsed","progress"], run, t => [

  const finRows = (d.finished || []).filter(t => keep(t, t.result, t.ended_utc));
  $("finished").innerHTML = rows("finished", [{t:"finished",tip:"local time; hover for the full date"},"key","prompt","repo","provider / model",{t:"elapsed",num:true},{t:"tokens",num:true},{t:"cost",num:true,tip:"as reported by the CLI"},"result"], finRows, t => [
    shortTime(t.finished_at, d.now), '<a href="' + esc(t.result_url) + '" title="result / diff">' + taskKey(t.key) + '</a>', esc(t.prompt || t.title || "-"),
    esc(t.repo), provModel(t.provider, t.model), esc(t.elapsed), t.tokens ? num(t.tokens) : "-", usd(t.cost_usd),
    '<span class="'+cls(t.result)+'">'+esc(t.result)+"</span>" + (t.reason && t.reason !== t.result ? ' <span class="meta">' + esc(t.reason) + "</span>" : "")
  ], null, ["nowrap","nowrap","wide","nowrap","nowrap","nowrap","nowrap","nowrap","wide"]);
  const max5 = Math.max(1, ...(d.providers || []).map(p => Number(p.tokens_5h) || 0));
  const max7 = Math.max(1, ...(d.providers || []).map(p => Number(p.tokens_7d) || 0));
  const bar = (v, m, kind) => '<span class="bar' + (kind === "out" ? " out" : "") + '" style="width:' + Math.round((Number(v) || 0) / m * 60) + 'px"></span>';
  $("providers").innerHTML = rows("providers", ["#","name","enabled","version","model",
    {t:"5h",tip:"atr-side runs / tokens in the last 5 hours"},{t:"7d",tip:"atr-side runs / tokens in the last 7 days"},"last success","cooldown",{t:"usage",tip:"plan limits reported by the CLI, when it exposes them"},{t:"extra credits",tip:"paid extra credits (Grok); display only, never spent by atr"}], d.providers, p => [
    esc(p.order), esc(p.name), p.enabled ? "yes" : "no", esc(p.version || "-"), esc(p.model || "default"),
    bar(p.tokens_5h, max5, "in") + num(p.runs_5h) + " runs · " + num(p.tokens_5h),
    bar(p.tokens_7d, max7, "out") + num(p.runs_7d) + " runs · " + num(p.tokens_7d),
    shortTime(p.last_success, d.now), p.cooling ? '<span class="warn">cooldown</span>' : "—",
    usageCell(p),
    p.extra_credits ? esc(p.extra_credits) : "-"

  const today = d.today || [];

    cost_usd: costs.length ? costs.reduce((a, r) => a + r.cost_usd, 0) : null, hit: ""} : null;
  $("today").innerHTML = rows("today", ["provider",{t:"runs",num:true},{t:"success",num:true},{t:"input",num:true,tip:"uncached input tokens"},{t:"cached",num:true,tip:"input tokens served from the prompt cache"},{t:"cache write",num:true},{t:"output",num:true},{t:"cost",num:true},
    {t:"cache hit %",tip:"share of input tokens served from the provider's prompt cache today"}], today, r => [
    esc(r.provider), num(r.runs), num(r.success), num(r.input), num(r.cached), num(r.cache_write), num(r.output), usd(r.cost_usd), esc(r.hit)

function savingsRuns(list) {
  const items = list.filter(r => Number(r.tokens_saved) > 0 || Number(r.cached) > 0);
  if (!items.length) return '<p class="empty">(no cache savings in this period)</p>';
  const max = Math.max(1, ...items.map(r => Number(r.tokens_saved) || 0));
  return rows("savingsRuns", ["provider", {t:"tokens saved", tip:"tokens served from cache instead of re-sent"}, {t:"cache hit %"}], items, r => [
    esc(r.provider), '<span class="bar" style="width:' + Math.round((Number(r.tokens_saved) || 0) / max * 160) + 'px"></span>' + num(r.tokens_saved), esc(r.hit)

}
function sparkBars(days, key, title, subtitle, color) {
  const w = 560, h = 168, padL = 44, padR = 10, top = 8, bottom = 28;
  const max = Math.max(1, ...days.map(d => Number(d[key]) || 0));
  const bw = (w - padL - padR) / Math.max(1, days.length);
  const fill = color === "orange" ? "#e3b341" : "#4c8bf5";
  let s = '<div class="chart-block"><div class="chart-title">' + esc(title) + '</div>';
  s += '<div class="chart-sub">' + esc(subtitle) + '</div>';
  s += '<svg viewBox="0 0 ' + w + ' ' + h + '" width="100%" height="' + h +
    '" role="img" aria-label="' + esc(title) + '">';
  for (let g = 0; g <= 3; g++) {
    const gy = top + (h - top - bottom) * g / 3;
    s += '<line x1="' + padL + '" x2="' + (w - padR) + '" y1="' + gy.toFixed(1) +
      '" y2="' + gy.toFixed(1) + '" stroke="#30363d" stroke-width="1"/>';
    s += '<text x="' + (padL - 6) + '" y="' + (gy + 3).toFixed(1) +
      '" text-anchor="end" font-size="10" fill="#8b949e" font-family="ui-monospace,monospace">' +
      compact(max * (1 - g / 3)) + "</text>";
  }
  days.forEach((d, i) => {
    const v = Number(d[key]) || 0;
    const bh = (v / max) * (h - top - bottom);
    const x = padL + i * bw;
    const y = h - bottom - bh;
    const barW = Math.max(2, bw * 0.55);
    const barX = x + (bw - barW) / 2;
    s += '<rect x="' + barX.toFixed(1) + '" y="' + y.toFixed(1) + '" width="' +
      barW.toFixed(1) + '" height="' + Math.max(0, bh).toFixed(1) + '" rx="2" fill="' + fill + '"><title>' +
      esc(d.day) + ": " + num(v) + "</title></rect>";
    if (days.length <= 14 || i % Math.ceil(days.length / 7) === 0) {
      s += '<text x="' + (x + bw / 2).toFixed(1) + '" y="' + (h - 8) +
        '" text-anchor="middle" font-size="10" fill="#8b949e">' + esc(String(d.day || "").slice(5)) + "</text>";
    }
  });
  return s + "</svg></div>";
}
function bars(days) {
  if (!days.length) return '<p class="empty">(none)</p>';
  return '<div class="chart-pair">' +
    sparkBars(days, "tokens_saved", "Tokens saved", "Cached tokens · selected period", "blue") +
    sparkBars(days, "output", "Output tokens", "Generated tokens · selected period", "orange") +
    "</div>";
}
function query() {
  const period = $("period").value;
  let q = "period=" + encodeURIComponent(period);
  $("customDates").hidden = period !== "custom";
  if (period === "custom") {
    const from = $("from").value;
    const to = $("to").value;
    if (from && to) q += "&from=" + encodeURIComponent(from) + "&to=" + encodeURIComponent(to);
  }
  const repo = $("repoFilter").value;
  if (repo) q += "&repo=" + encodeURIComponent(repo);
  return q;
}
async function tick() {
  try {
    const r = await fetch("dashboard.json?" + query(), {cache: "no-store"});
    if (!r.ok) throw new Error(r.status);
    paint(await r.json());
  } catch (e) {
    $("meta").textContent = "dashboard unavailable: " + e;
    setStatus("fail", "Unavailable");
  }
}
["period","from","to","repoFilter"].forEach(id => $(id).addEventListener("change", tick));
["statusFilter","providerFilter","windowFilter"].forEach(id => $(id).addEventListener("change", () => last && paint(last)));
setInterval(() => document.querySelectorAll(".live").forEach(el => el.textContent = elapsedSince(el.dataset.since)), 1000);
tick();
setInterval(tick, 5000);
</script>
