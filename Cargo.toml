[package]
name = "atr"
# First-release floor. Do not bump for shipping — tags inject ATR_RELEASE_VERSION.
version = "0.1.1"
edition = "2021"
rust-version = "1.85"
description = "Agent task runner — drives official agent CLIs on existing subscription plans"
license = "MIT OR Apache-2.0"
repository = "https://github.com/rimusz/agent-task-runner"
default-run = "atr"

[dependencies]
anyhow = "1"
axum = { version = "0.7", default-features = false, features = ["json", "tokio", "http1"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
chrono-tz = "0.10"
clap = { version = "4", features = ["derive", "env"] }
libc = "0.2"
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shellexpand = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "signal", "io-std", "io-util", "time", "net", "sync", "fs"] }
toml = "0.8"
toml_edit = "0.22"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ureq = { version = "2.10", default-features = false, features = ["json", "tls"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = false
codegen-units = 16
